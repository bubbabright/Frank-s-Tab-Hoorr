<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tab Hoor</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="logo">TAB HOOR <span class="version" id="version"></span></div>
      <div class="header-actions">
        <button type="button" class="icon-btn" id="btnHistory" title="History">◷</button>
        <button type="button" class="icon-btn" id="btnOptions" title="Settings">⚙</button>
      </div>
    </header>

    <section class="closer-section">
      <div class="section-header">
        <span>FEELING OVERWHELMED?</span>
      </div>
      <div class="closer-row">
        <button type="button" id="lnkDupes">Close Dupes</button>
        <button type="button" id="btnMerge">Merge Windows</button>
      </div>
      <div class="closer-row" id="groupRow" hidden>
        <button type="button" id="btnGroup">Group Tabs</button>
        <button type="button" id="btnUngroup">Ungroup Tabs</button>
      </div>
      <div class="closer-row">
        <label class="sr-only" for="idleThreshold">Idle cleanup threshold</label>
        <input type="text" id="idleThreshold" value="30m" placeholder="30m, 1h, 90m, 1d" inputmode="text" />
        <span class="help-icon" tabindex="0" title="Closes idle normal tabs right now, using the time you typed. Idle pinned tabs are discarded (unloaded, not closed) instead of closed. Active and audio-playing tabs are always safe. Formats: 30m, 1h, 90m, 1d, 2h30m.">?</span>
        <button type="button" id="btnIdleCleanup">Idle Cleanup</button>
      </div>
    </section>

    <div class="load-error" id="loadError" role="alert" hidden>Couldn't load stats. Close and reopen the popup.</div>

    <section class="score-section">
      <div class="score-main">
        <div class="tab-count" id="tabCount" aria-live="polite">—</div>
        <div class="score-side">
          <div class="count-label">tabs open</div>
          <div class="window-count" id="windowCount"></div>
        </div>
      </div>
    </section>

    <section class="stats-row">
      <div class="stat">
        <div class="stat-value" id="allTimeHigh">—</div>
        <div class="stat-label">all-time high</div>
        <div class="stat-sub" id="allTimeHighDate">—</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat stat-spark">
        <div class="stat-label">14-day trend</div>
        <div id="sparkline"></div>
      </div>
    </section>
  </div>
  <script src="../data.js"></script>
  <script src="popup.js"></script>
</body>
</html>
