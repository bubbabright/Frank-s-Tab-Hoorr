<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tab Hoor</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <div id="app">

    <!-- Header -->
    <header>
      <div class="logo">TAB HOOR</div>
      <div class="tagline">an honest assessment</div>
    </header>

    <!-- Main score -->
    <section class="score-section">
      <div class="tab-count" id="tabCount">—</div>
      <div class="count-label">tabs open</div>
      <div class="window-count" id="windowCount"></div>
    </section>

    <!-- Rank -->
    <section class="rank-section">
      <div class="rank-label">YOUR RANK</div>
      <div class="rank-title" id="rankTitle">…</div>
      <div class="rank-quote" id="rankQuote">…</div>
    </section>

    <!-- Stats row -->
    <section class="stats-row">
      <div class="stat">
        <div class="stat-value" id="allTimeHigh">—</div>
        <div class="stat-label">all-time high</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <div class="stat-value" id="allTimeHighDate">—</div>
        <div class="stat-label">date set</div>
      </div>
    </section>

    <!-- Achievements -->
    <section class="achievements-section">
      <div class="section-header">ACHIEVEMENTS</div>
      <div class="achievements-grid" id="achievementsGrid">
        <!-- populated by JS -->
      </div>
    </section>

    <!-- Harm reduction footer -->
    <footer>
      <div class="footer-text">feeling overwhelmed?</div>
      <div class="footer-links">
        <a href="https://addons.mozilla.org/firefox/addon/duplicate-tabs-closer/" target="_blank">close dupes</a>
        <span class="footer-sep">·</span>
        <a href="https://addons.mozilla.org/en-US/firefox/addon/merge/" target="_blank">merge windows</a>
      </div>
    </footer>

  </div>

  <script src="popup.js"></script>
</body>
</html>
